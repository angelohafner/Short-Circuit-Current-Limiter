   </g>
   <g id="text_20">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17334b" transform="translate(429.048 374.161375)">Normal: valve blocked; reactor and capacitor compensate.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17334b" transform="translate(429.048 390.161375)">Fault: valve conducts; current passes through the reactor.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #17334b" transform="translate(429.048 406.161375)">Native MOV and SCR snubbers protect the capacitor branch.</text>
